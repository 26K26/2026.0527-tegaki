<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>数学 手書き小テスト（配布機能付き完成版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f0f4f8; text-align: center; }
    .container { max-width: 600px; margin: 0 auto; background-color: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { color: #333; margin-bottom: 5px; }
    h3 { color: #0288d1; margin-top: 5px; margin-bottom: 20px; }
    
    /* 入力フォーム */
    form label { display: block; margin: 15px 0 5px; font-weight: bold; text-align: left; }
    form input, form select { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    
    /* 先生用設定エリアの特別な装飾 */
    #setup-area { background-color: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #e0e0e0; margin-top: 25px; }
    
    /* 1問ずつのブロック */
    .question-block { border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-bottom: 25px; background-color: #fafafa; }
    .q-text { font-size: 24px; font-weight: bold; margin-bottom: 10px; text-align: left; }
    
    canvas { border: 2px dashed #78909c; background-color: #fff; border-radius: 8px; cursor: crosshair; touch-action: none; width: 100%; max-width: 400px; height: 150px; }
    
    .canvas-tools { text-align: right; margin-top: 5px; }
    .canvas-tools button { padding: 5px 10px; font-size: 12px; background-color: #9e9e9e; color: white; border: none; border-radius: 4px; cursor: pointer; }
    
    /* 自己採点エリア */
    .answer-area { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ccc; }
    .correct-ans { font-size: 22px; color: #2e7d32; font-weight: bold; margin-bottom: 10px; }
    .ox-buttons button { padding: 8px 20px; font-size: 16px; margin: 0 5px; border: none; color: white; border-radius: 6px; cursor: pointer; }
    .btn-o { background-color: #e0e0e0; color: #333; }
    .btn-x { background-color: #e0e0e0; color: #333; }
    .btn-o.selected { background-color: #4caf50; color: white; }
    .btn-x.selected { background-color: #f44336; color: white; }

    .btn-main { padding: 12px 30px; font-size: 18px; background-color: #0288d1; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 20px; }
    .btn-main:hover { background-color: #01579b; }
    
    #quiz-screen, #result-screen { display: none; }
  </style>
</head>
<body>

<div class="container" id="start-screen">
  <h2>数学 手書き小テスト</h2>
  <h3 id="target-title" style="display:none;"></h3>
  
  <form id="user-form">
    <label>出席番号</label>
    <input type="number" id="number" min="1" max="60" required placeholder="例: 15">

    <label>名前</label>
    <input type="text" id="name" required placeholder="氏名を入力してください">
    
    <div id="setup-area">
      <p style="font-size: 13px; color: #666; text-align: left; margin: 0 0 10px 0; font-weight: bold;">🛠️ 先生用メニュー（生徒へ配るテストの設定）</p>
      
      <label>学年</label>
      <select id="grade-select" onchange="updateTopic()">
        <option value="">選択してください</option>
        <option value="3年">中学3年生</option>
      </select>
      
      <label>単元</label>
      <select id="topic-select"><option value="">先に学年を選択</option></select>
      
      <label style="display: flex; align-items: center; margin-top: 15px; background: #fff3e0; padding: 10px; border-radius: 6px; font-size: 14px;">
        <input type="checkbox" id="random-check" style="width: 20px; margin-right: 10px;">
        問題をランダムに並び替える
      </label>

      <button type="button" class="btn-main" style="background-color: #4caf50; font-size: 16px;" onclick="generateShareLink()">生徒用配布リンク・QRコードを作成</button>
      
      <div id="qr-area" style="display:none; margin-top: 20px; padding: 15px; border: 2px dashed #4caf50; border-radius: 8px; background: #f1f8e9;">
        <p style="font-weight:bold; margin:0 0 10px 0; color:#2e7d32; font-size: 14px;">👇 生徒にこのQRコードを読み取らせてください</p>
        <img id="qr-image" src="" alt="QRコード" style="margin-bottom:10px; border: 1px solid #ccc; background:#fff; padding:5px;"><br>
        <input type="text" id="share-url" readonly onclick="this.select()" style="font-size:11px; text-align:center; background:#fff; color:#555; cursor:pointer;" title="クリックしてURLをコピー">
        <p style="font-size:11px; color:#666; margin:5px 0 0 0;">（クリックするとURLを全選択できます）</p>
      </div>
    </div>

    <button type="submit" class="btn-main" id="start-btn" style="margin-top:25px;">テスト開始</button>
  </form>
</div>

<div class="container" id="quiz-screen">
  <div id="questions-container"></div>
  
  <button type="button" class="btn-main" id="check-ans-btn" onclick="revealAllAnswers()">答え合わせをする</button>
  <button type="button" class="btn-main" id="submit-btn" style="display:none; background-color:#d32f2f;" onclick="submitTest()">結果を送信する</button>
</div>

<div class="container" id="result-screen">
  <h2>テスト終了</h2>
  <p id="status-text">データを送信しています...</p>
</div>

<script>
  // 💡 自動反映された最新のGAS URL
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbypi0BpMk7PVmiVGgqwuQk9FjK9vnDr9IliYDAwpEB3sfBOmGdIsPfyfvKqMOlGnsIO/exec';

  const db = {
    "3年": {
      "平方根の変形 (a√b)": [
        { q: '\\sqrt{12}', a: '2√3' }, { q: '\\sqrt{20}', a: '2√5' },
        { q: '\\sqrt{45}', a: '3√5' }, { q: '\\sqrt{24}', a: '2√6' }, { q: '\\sqrt{50}', a: '5√2' }
      ]
    }
  };

  let activeQuestions = [];
  let canvases = [];
  let contexts = [];
  let isDrawingArr = [];
  let scores = [];
  let isStudentMode = false;

  // ページ読み込み時にURLパラメータを解析
  window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const pGrade = urlParams.get('g');
    const pTopic = urlParams.get('t');
    const pRandom = urlParams.get('r');

    if (pGrade && pTopic && db[pGrade] && db[pGrade][pTopic]) {
      // 生徒用モードの起動
      isStudentMode = true;
      document.getElementById('setup-area').style.display = 'none'; // 先生用メニューを隠す
      
      document.getElementById('target-title').innerText = `【${pGrade}】${pTopic}`;
      document.getElementById('target-title').style.display = 'block';
      
      // 内部データに値をセット
      document.getElementById('grade-select').innerHTML = `<option value="${pGrade}">${pGrade}</option>`;
      document.getElementById('topic-select').innerHTML = `<option value="${pTopic}">${pTopic}</option>`;
      document.getElementById('random-check').checked = (pRandom === '1');
      document.getElementById('start-btn').innerText = "小テストを開始する";
    } else {
      // 先生用モード（初期状態）
      updateTopic();
    }
  });

  function updateTopic() {
    const grade = document.getElementById('grade-select').value;
    const topicSel = document.getElementById('topic-select');
    topicSel.innerHTML = '<option value="">選択してください</option>';
    if(grade && db[grade]) {
      Object.keys(db[grade]).forEach(t => topicSel.innerHTML += `<option value="${t}">${t}</option>`);
    }
  }

  // 生徒用配布リンクとQRコードを生成する関数
  function generateShareLink() {
    const grade = document.getElementById('grade-select').value;
    const topic = document.getElementById('topic-select').value;
    const isRandom = document.getElementById('random-check').checked ? '1' : '0';
    
    if (!grade || !topic) {
      alert("生徒に配布する「学年」と「単元」を先に選択してください。");
      return;
    }
    
    // 現在のHTMLのURLを取得し、パラメータを合成
    const baseUrl = window.location.origin + window.location.pathname;
    const shareUrl = `${baseUrl}?g=${encodeURIComponent(grade)}&t=${encodeURIComponent(topic)}&r=${isRandom}`;
    
    document.getElementById('share-url').value = shareUrl;
    
    // QRコード生成APIを利用して画像を表示
    const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(shareUrl)}`;
    document.getElementById('qr-image').src = qrApiUrl;
    document.getElementById('qr-area').style.display = 'block';
  }

  document.getElementById('user-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const grade = document.getElementById('grade-select').value;
    const topic = document.getElementById('topic-select').value;
    const isRandom = document.getElementById('random-check').checked;
    
    if(!grade || !topic) {
      alert("学年と単元が選択されていません。");
      return;
    }
    
    let questions = [...db[grade][topic]];
    if (isRandom) questions.sort(() => Math.random() - 0.5);
    activeQuestions = questions.slice(0, 5); 
    scores = new Array(activeQuestions.length).fill(null);

    buildQuizUI();
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
  });

  function buildQuizUI() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';
    canvases = []; contexts = []; isDrawingArr = [];

    activeQuestions.forEach((item, index) => {
      const block = document.createElement('div');
      block.className = 'question-block';
      block.innerHTML = `
        <div class="q-text">問${index + 1}: \\(${item.q}\\) =</div>
        <canvas id="cvs-${index}" width="400" height="150"></canvas>
        <div class="canvas-tools"><button type="button" onclick="clearSpecificCanvas(${index})">リセット</button></div>
        
        <div class="answer-area" id="ans-area-${index}">
          <div class="correct-ans">正解: \\(${item.a}\\)</div>
          <div class="ox-buttons">
            <button type="button" class="btn-o" id="btn-o-${index}" onclick="setScore(${index}, 1)">〇 正解</button>
            <button type="button" class="btn-x" id="btn-x-${index}" onclick="setScore(${index}, 0)">× まちがい</button>
          </div>
        </div>
      `;
      container.appendChild(block);
      
      const cvs = document.getElementById(`cvs-${index}`);
      const ctx = cvs.getContext('2d');
      ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = '#1a237e';
      
      canvases.push(cvs); contexts.push(ctx); isDrawingArr.push(false);
      setupCanvasEvents(cvs, ctx, index);
    });
    if (window.MathJax) MathJax.typesetPromise();
  }

  function setupCanvasEvents(cvs, ctx, idx) {
    const getPos = (e) => {
      const rect = cvs.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      const scaleX = cvs.width / rect.width;
      const scaleY = cvs.height / rect.height;
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    };
    const start = (e) => { isDrawingArr[idx] = true; ctx.beginPath(); let p = getPos(e); ctx.moveTo(p.x, p.y); };
    const move = (e) => { if(!isDrawingArr[idx]) return; e.preventDefault(); let p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
    const stop = () => { isDrawingArr[idx] = false; };

    cvs.addEventListener('mousedown', start); cvs.addEventListener('mousemove', move); cvs.addEventListener('mouseup', stop);
    cvs.addEventListener('touchstart', start, {passive:false}); cvs.addEventListener('touchmove', move, {passive:false}); cvs.addEventListener('touchend', stop);
  }

  function clearSpecificCanvas(idx) {
    contexts[idx].clearRect(0, 0, canvases[idx].width, canvases[idx].height);
  }

  function revealAllAnswers() {
    activeQuestions.forEach((_, i) => {
      document.getElementById(`ans-area-${i}`).style.display = 'block';
    });
    document.getElementById('check-ans-btn').style.display = 'none';
    document.getElementById('submit-btn').style.display = 'block';
    if (window.MathJax) MathJax.typesetPromise();
  }

  function setScore(idx, val) {
    scores[idx] = val;
    document.getElementById(`btn-o-${idx}`).classList.toggle('selected', val === 1);
    document.getElementById(`btn-x-${idx}`).classList.toggle('selected', val === 0);
  }

  async function submitTest() {
    if (scores.includes(null)) {
      alert("すべての問題の「〇」か「×」を選択してください。");
      return;
    }
    
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    
    const images = canvases.map(c => c.toDataURL('image/jpeg', 0.3));
    const finalScore = scores.reduce((a,b)=>a+b,0);
    
    const payload = {
      name: document.getElementById('name').value,
      grade: document.getElementById('grade-select').value + "_" + document.getElementById('topic-select').value,
      number: document.getElementById('number').value, // 出席番号を正しく反映
      score: finalScore,
      results: scores.join(','),
      images: images
    };

    try {
      await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
      document.getElementById('status-text').innerHTML = `送信完了！<br>スコア: ${activeQuestions.length}問中 ${finalScore}問正解`;
    } catch (e) {
      alert("エラーが発生しました。");
    }
  }
</script>
</body>
</html>

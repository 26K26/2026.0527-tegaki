<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>手書き小テストシステム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f0f4f8; text-align: center; }
    .container { max-width: 600px; margin: 0 auto; background-color: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; }
    h2 { color: #333; margin-bottom: 5px; }
    h3 { color: #0288d1; margin-top: 5px; margin-bottom: 20px; }
    
    /* 入力フォーム */
    form label { display: block; margin: 15px 0 5px; font-weight: bold; text-align: left; }
    form input, form select { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    
    /* 先生用設定エリアの装飾 */
    #setup-area { text-align: left; }
    .menu-title { font-size: 16px; color: #333; font-weight: bold; margin-bottom: 20px; text-align: center; border-bottom: 2px solid #0288d1; padding-bottom: 8px; }
    
    /* 1問ずつのブロック */
    .question-block { border: 2px solid #e0e0e0; border-radius: 8px; margin-bottom: 25px; background-color: #fafafa; overflow: hidden; text-align: left; }
    
    /* 2層構造（テキスト層とキャンバス層）を内包するメインゾーン */
    .quiz-main-zone { position: relative; width: 100%; background-color: #fff; }
    
    /* 背面：テキスト層 */
    .text-layer { padding: 15px; position: relative; z-index: 1; pointer-events: none; user-select: none; }
    .q-text { font-size: 22px; font-weight: bold; color: #333; margin-bottom: 15px; }
    
    /* 計算・メモスペースの縦幅を300pxに拡張 */
    .memo-guide { border-top: 1px dashed #b0bec5; margin-top: 10px; padding-top: 5px; height: 300px; color: #90a4ae; font-size: 13px; }
    
    /* 解答欄の枠組み */
    .ans-box-frame { border: 2px solid #0288d1; border-radius: 6px; padding: 8px 12px; background-color: #e1f5fe; width: 70%; margin: 10px 0 0 auto; box-sizing: border-box; }
    .ans-box-label { font-size: 11px; color: #0288d1; font-weight: bold; display: block; margin-bottom: 25px; }
    
    /* 前面：透明キャンバス層 */
    canvas.canvas-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; background: transparent; cursor: crosshair; touch-action: none; }
    
    /* キャンバスの外側（操作・自己採点エリア） */
    .control-zone { padding: 10px 15px; background-color: #f5f7f8; border-top: 1px solid #e0e0e0; position: relative; z-index: 3; }
    .canvas-tools { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
    
    /* モード切り替えツールのボタンスタイル */
    .btn-tool { padding: 6px 10px; font-size: 12px; background-color: #e0e0e0; color: #333; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-tool.active { background-color: #0288d1; color: white; }
    .btn-tool:disabled { background-color: #e0e0e0; color: #a6a6a6; cursor: not-allowed; }
    
    /* 自己採点エリア */
    .answer-area { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ccc; }
    .correct-ans { font-size: 20px; color: #2e7d32; font-weight: bold; margin-bottom: 10px; }
    .ox-buttons { text-align: center; }
    .ox-buttons button { padding: 8px 20px; font-size: 16px; margin: 0 5px; border: none; color: white; border-radius: 6px; cursor: pointer; }
    .btn-o { background-color: #e0e0e0; color: #333; }
    .btn-x { background-color: #e0e0e0; color: #333; }
    .btn-o.selected { background-color: #4caf50; color: white; }
    .btn-x.selected { background-color: #f44336; color: white; }

    .btn-main { padding: 12px 30px; font-size: 18px; background-color: #0288d1; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 20px; }
    .btn-main:hover { background-color: #01579b; }
    .btn-main:disabled { background-color: #b0bec5; cursor: not-allowed; }
    
    /* 送信画像に含めるヘッダー情報 */
    #quiz-header { display: none; text-align: left; padding-bottom: 10px; margin-bottom: 20px; border-bottom: 2px solid #333; }
    #quiz-hd-title { font-size: 18px; font-weight: bold; color: #0288d1; }
    #quiz-hd-meta { font-size: 15px; margin-top: 5px; font-weight: bold; color: #333; }

    /* タイマー表示エリアのスタイル */
    #timer-display { display: none; font-size: 20px; font-weight: bold; color: #d32f2f; margin-bottom: 15px; background: #ffebee; padding: 10px; border-radius: 6px; border: 1px solid #ef9a9a; }

    #quiz-screen, #result-screen, #start-screen { display: none; }
  </style>
</head>
<body>

<div class="container" id="loading-screen">
  <p style="font-size: 18px; font-weight: bold; color: #0288d1; margin: 20px 0 5px 0;">🔄 データを読み込み中...</p>
  <p style="font-size: 13px; color: #666; margin-bottom: 20px;">しばらくお待ちください</p>
</div>

<div class="container" id="start-screen">
  <h2>小テストシステム</h2>
  <h3 id="target-title" style="display:none;"></h3>
  
  <div id="setup-area">
    <p class="menu-title">👨‍🏫 先生用・問題配布管理メニュー</p>
    
    <label>学年・教科</label>
    <select id="grade-select" onchange="updateTopic()">
      <option value="">読み込み中...</option>
    </select>
    
    <label>単元（複数選択可）</label>
    <div id="topic-checkboxes" style="background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 10px; max-height: 150px; overflow-y: auto; text-align: left; box-sizing: border-box;">
      先に学年・教科を選択してください
    </div>

    <label>出題問題数</label>
    <select id="question-count-select">
      <option value="1">1問</option>
      <option value="2">2問</option>
      <option value="3">3問</option>
      <option value="4">4問</option>
      <option value="5" selected>5問</option>
      <option value="6">6問</option>
      <option value="7">7問</option>
      <option value="8">8問</option>
      <option value="9">9問</option>
      <option value="10">10問</option>
      <option value="11">11問</option>
      <option value="12">12問</option>
      <option value="13">13問</option>
      <option value="14">14問</option>
      <option value="15">15問</option>
      <option value="16">16問</option>
      <option value="17">17問</option>
      <option value="18">18問</option>
      <option value="19">19問</option>
      <option value="20">20問</option>
    </select>
    
    <label style="display: flex; align-items: center; margin-top: 15px; background: #fff3e0; padding: 10px; border-radius: 6px; font-size: 14px;">
      <input type="checkbox" id="random-check" style="width: 20px; margin-right: 10px;">
      問題をランダムに並び替える
    </label>

    <label style="display: flex; align-items: center; margin-top: 15px; background: #fff3e0; padding: 10px; border-radius: 6px; font-size: 14px;">
      <input type="checkbox" id="timer-check" style="width: 20px; margin-right: 10px;" onchange="toggleTimerInput()">
      制限時間を設定する
    </label>
    <div id="timer-input-area" style="display: none; margin-top: 5px; padding-left: 10px; text-align: left;">
      <input type="number" id="timer-duration" min="1" max="120" value="10" style="width: 80px; display: inline-block; padding: 5px;"> 分
    </div>

    <label style="display: flex; align-items: center; margin-top: 15px; background: #fff3e0; padding: 10px; border-radius: 6px; font-size: 14px;">
      <input type="checkbox" id="tab-lock-check" style="width: 20px; margin-right: 10px;">
      タブ切り替え（移動）を禁止する
    </label>

    <button type="button" class="btn-main" style="background-color: #4caf50; font-size: 16px;" onclick="generateShareLink()">生徒用配布リンク・QRコードを作成</button>
    
    <div id="qr-area" style="display:none; margin-top: 20px; padding: 15px; border: 2px dashed #4caf50; border-radius: 8px; background: #f1f8e9; text-align: center;">
      <p style="font-weight:bold; margin:0 0 10px 0; color:#2e7d32; font-size: 14px;">👇 生徒にこのQRコードを読み取らせてください</p>
      <img id="qr-image" src="" alt="QRコード" style="margin-bottom:10px; border: 1px solid #ccc; background:#fff; padding:5px;"><br>
      <input type="text" id="share-url" readonly onclick="this.select()" style="font-size:11px; text-align:center; background:#fff; color:#555; cursor:pointer;" title="クリックしてURLをコピー">
      <p style="font-size:11px; color:#666; margin:5px 0 0 0;">（クリックするとURLを全選択できます）</p>
    </div>
  </div>

  <form id="user-form">
    <div id="student-login-area" style="display:none;">
      <label>出席番号</label>
      <input type="number" id="number" min="1" max="60" required placeholder="例: 15">

      <label>名前</label>
      <input type="text" id="name" required placeholder="氏名を入力してください">
      
      <button type="submit" class="btn-main" id="start-btn" style="margin-top:25px;">小テストを開始する</button>
    </div>
  </form>
</div>

<div class="container" id="quiz-screen">
  <div id="timer-display">⏱️ 残り時間: <span id="timer-count">--:--</span></div>

  <div id="quiz-header">
    <div id="quiz-hd-title"></div>
    <div id="quiz-hd-meta"></div>
  </div>

  <div id="questions-container"></div>
  
  <button type="button" class="btn-main" id="check-ans-btn" onclick="revealAllAnswers()">答え合わせをする</button>
  <button type="button" class="btn-main" id="submit-btn" style="display:none; background-color:#d32f2f;" onclick="submitTest()">結果を送信する</button>
</div>

<div class="container" id="result-screen">
  <h2>テスト終了</h2>
  <p id="status-text">データを送信しています...</p>
</div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbypi0BpMk7PVmiVGgqwuQk9FjK9vnDr9IliYDAwpEB3sfBOmGdIsPfyfvKqMOlGnsIO/exec';

  let db = {}; 
  let activeQuestions = [];
  let canvases = [];
  let contexts = [];
  let isDrawingArr = [];
  let toolModes = []; 
  let strokeHistories = []; // 各問題の線データ履歴を管理する配列
  let scores = [];
  let isStudentMode = false;
  let activeTopics = [];

  // 【追加】テスト管理用変数
  let isTimerEnabled = false;
  let timerDurationSeconds = 600; 
  let timerInterval = null;
  let isTabLockEnabled = false;
  let isQuizActive = false; // テスト実施中（答え合わせ前）かどうかの判定フラグ

  window.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('loading-screen').style.display = 'block';

    const urlParams = new URLSearchParams(window.location.search);
    
    let pGrade = "";
    let pTopic = "";
    try {
      if(urlParams.get('g')) pGrade = decodeURIComponent(urlParams.get('g'));
      if(urlParams.get('t')) pTopic = decodeURIComponent(urlParams.get('t'));
    } catch(e) {
      pGrade = urlParams.get('g') || "";
      pTopic = urlParams.get('t') || "";
    }
    
    const pQCount = urlParams.get('q') || '5';
    const pRandom = urlParams.get('r');

    if (pGrade && pTopic) {
      isStudentMode = true;
      document.getElementById('setup-area').style.display = 'none'; 
      document.getElementById('student-login-area').style.display = 'block'; 
      
      const displayTopics = pTopic.split(',').join('・');
      document.getElementById('target-title').innerText = `【${pGrade}】${displayTopics} （全${pQCount}問）`;
      document.getElementById('target-title').style.display = 'block';
      
      document.getElementById('grade-select').innerHTML = `<option value="${pGrade}">${pGrade}</option>`;
      document.getElementById('random-check').checked = (pRandom === '1');
      
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('start-screen').style.display = 'block';
    } else {
      try {
        const res = await fetch(`${GAS_URL}?action=getMenu`);
        db = await res.json();
        
        if (db.error) {
          alert(db.error);
          document.getElementById('loading-screen').style.display = 'none';
          return;
        }
        
        const gradeSel = document.getElementById('grade-select');
        gradeSel.innerHTML = '<option value="">選択してください</option>';
        Object.keys(db).forEach(g => {
          gradeSel.innerHTML += `<option value="${g}">${g}</option>`;
        });
        
        updateTopic();
        
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('start-screen').style.display = 'block';
      } catch (err) {
        alert("スプレッドシートからのデータ取得に失敗しました。");
        document.getElementById('loading-screen').style.display = 'none';
      }
    }
  });

  // 【追加】タイマー設定入力欄の表示切り替え
  function toggleTimerInput() {
    const chk = document.getElementById('timer-check');
    document.getElementById('timer-input-area').style.display = chk.checked ? 'block' : 'none';
  }

  function updateTopic() {
    const grade = document.getElementById('grade-select').value;
    const container = document.getElementById('topic-checkboxes');
    container.innerHTML = '';
    
    if(grade && db[grade]) {
      db[grade].forEach((t, index) => {
        const label = document.createElement('label');
        label.style.display = 'flex';
        label.style.alignItems = 'center';
        label.style.margin = '6px 0';
        label.style.fontWeight = 'normal';
        label.style.cursor = 'pointer';
        
        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.name = 'topics';
        chk.value = t;
        chk.style.width = '20px';
        chk.style.marginRight = '10px';
        chk.style.cursor = 'pointer';
        
        label.appendChild(chk);
        label.appendChild(document.createTextNode(t));
        container.appendChild(label);
      });
    } else {
      container.innerHTML = '先に学年・教科を選択してください';
    }
  }

  function generateShareLink() {
    const grade = document.getElementById('grade-select').value;
    const checkedBoxes = document.querySelectorAll('input[name="topics"]:checked');
    const topics = Array.from(checkedBoxes).map(cb => cb.value);
    const qCount = document.getElementById('question-count-select').value;
    const isRandom = document.getElementById('random-check').checked ? '1' : '0';
    
    // 【追加】パラメータ取得
    const isTimer = document.getElementById('timer-check').checked ? '1' : '0';
    const duration = document.getElementById('timer-duration').value;
    const isTabLock = document.getElementById('tab-lock-check').checked ? '1' : '0';
    
    if (!grade || topics.length === 0) {
      alert("生徒に配布する「学年・教科」と「単元」を先に選択してください。");
      return;
    }
    
    const baseUrl = window.location.origin + window.location.pathname;
    // URLに新設定を付与
    const shareUrl = `${baseUrl}?g=${encodeURIComponent(grade)}&t=${encodeURIComponent(topics.join(','))}&q=${qCount}&r=${isRandom}&tm=${isTimer}&tl=${duration}&tb=${isTabLock}`;
    
    document.getElementById('share-url').value = shareUrl;
    const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(shareUrl)}`;
    document.getElementById('qr-image').src = qrApiUrl;
    document.getElementById('qr-area').style.display = 'block';
  }

  document.getElementById('user-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('loading-screen').style.display = 'block';
    
    const grade = document.getElementById('grade-select').value;
    const isRandom = document.getElementById('random-check').checked;
    const name = document.getElementById('name').value || "テストプレイヤー";
    const number = document.getElementById('number').value || "0";
    
    const urlParams = new URLSearchParams(window.location.search);
    let qCount = 5;
    
    if (urlParams.get('g') && urlParams.get('t')) {
      try {
        activeTopics = decodeURIComponent(urlParams.get('t')).split(',');
      } catch(e) {
        activeTopics = urlParams.get('t').split(',');
      }
      qCount = parseInt(urlParams.get('q') || '5', 10);
      
      // 【追加】生徒モード時のパラメータ読み込み
      isTimerEnabled = (urlParams.get('tm') === '1');
      timerDurationSeconds = parseInt(urlParams.get('tl') || '10', 10) * 60;
      isTabLockEnabled = (urlParams.get('tb') === '1');
    } else {
      const checkedBoxes = document.querySelectorAll('input[name="topics"]:checked');
      activeTopics = Array.from(checkedBoxes).map(cb => cb.value);
      qCount = parseInt(document.getElementById('question-count-select').value, 10);
      
      // 【追加】先生自身がテストをプレビューする場合の設定取得
      isTimerEnabled = document.getElementById('timer-check').checked;
      timerDurationSeconds = parseInt(document.getElementById('timer-duration').value, 10) * 60;
      isTabLockEnabled = document.getElementById('tab-lock-check').checked;
    }
    
    if (activeTopics.length === 0) {
      alert("単元が選択されていません。");
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('start-screen').style.display = 'block';
      return;
    }
    
    document.getElementById('quiz-header').style.display = 'block';
    document.getElementById('quiz-hd-title').innerText = `単元テスト: ${grade} 【${activeTopics.join('・')}】`;
    document.getElementById('quiz-hd-meta').innerText = `出席番号: ${number} 番 氏名: ${name}`;
    
    try {
      let allQuestions = [];
      const fetchPromises = activeTopics.map(async (topic) => {
        const res = await fetch(`${GAS_URL}?action=getQuestions&grade=${encodeURIComponent(grade)}&topic=${encodeURIComponent(topic)}`);
        const questions = await res.json();
        return Array.isArray(questions) ? questions : [];
      });
      
      const results = await Promise.all(fetchPromises);
      results.forEach(questions => { allQuestions = allQuestions.concat(questions); });
      
      if (!allQuestions || allQuestions.length === 0) {
        alert("該当する問題が見つかりませんでした。");
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('start-screen').style.display = 'block';
        return;
      }
      
      let qList = [...allQuestions];
      if (isRandom) qList.sort(() => Math.random() - 0.5);
      
      activeQuestions = qList.slice(0, qCount); 
      scores = new Array(activeQuestions.length).fill(null);
      toolModes = new Array(activeQuestions.length).fill('pen');
      strokeHistories = new Array(activeQuestions.length).fill(null).map(() => []);

      await buildQuizUI();
      
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('quiz-screen').style.display = 'block';
      
      syncCanvasSizes();

      // 【追加】クイズ画面表示後にテスト機能を発動
      isQuizActive = true;
      if (isTimerEnabled) {
        startTimerCounter();
      }
      if (isTabLockEnabled) {
        startTabLockListening();
      }
      
    } catch (err) {
      alert("問題データのロードに失敗しました。");
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('start-screen').style.display = 'block';
    }
  });

  // 【追加】制限タイマーカウントダウンの処理
  function startTimerCounter() {
    const displayArea = document.getElementById('timer-display');
    const countEl = document.getElementById('timer-count');
    displayArea.style.display = 'block';
    
    let timeRemaining = timerDurationSeconds;
    updateTimerDisplay(timeRemaining, countEl);
    
    timerInterval = setInterval(() => {
      timeRemaining--;
      updateTimerDisplay(timeRemaining, countEl);
      
      if (timeRemaining <= 0) {
        clearInterval(timerInterval);
        timerInterval = null;
        isQuizActive = false; // 先にフラグを落としてタブ移動の誤動作を防ぐ
        alert("⏳ 制限時間になりました！自動的に答え合わせページに移動します。");
        revealAllAnswers();
      }
    }, 1000);
  }

  function updateTimerDisplay(secs, element) {
    if (secs < 0) secs = 0;
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    element.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  // 【追加】タブ移動（非表示）監視の開始
  function startTabLockListening() {
    document.removeEventListener('visibilitychange', handleTabLeave);
    document.addEventListener('visibilitychange', handleTabLeave);
  }

  // 【追加】タブ移動が検出されたときの強制切り替え処理
  function handleTabLeave() {
    if (!isQuizActive) return;
    
    // タブが切り替わるかブラウザが最小化された時
    if (document.hidden || document.visibilityState === 'hidden') {
      isQuizActive = false;
      document.removeEventListener('visibilitychange', handleTabLeave);
      
      alert("⚠️ タブの移動（またはブラウザの離脱）が検出されました！\n不正行為防止のため、テストを強制終了し、答え合わせページへ移動します。");
      revealAllAnswers();
    }
  }

  async function buildQuizUI() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';
    canvases = []; contexts = []; isDrawingArr = []; strokeHistories = [];

    activeQuestions.forEach((item, index) => {
      const displayQuestion = item.q.includes('\\') ? `\\(${item.q}\\)` : item.q;
      const displayAnswer = item.a.includes('\\') ? `\\(${item.a}\\)` : item.a;

      const block = document.createElement('div');
      block.className = 'question-block';
      block.id = `q-block-${index}`;
      
      block.innerHTML = `
        <div class="quiz-main-zone" id="main-zone-${index}">
          <div class="text-layer" id="text-layer-${index}">
            <div class="q-text">問${index + 1}: &nbsp; ${displayQuestion}</div>
            <div class="memo-guide">✏️ 計算・メモスペース</div>
            <div class="ans-box-frame">
              <span class="ans-box-label">解答欄</span>
            </div>
          </div>
          <canvas id="cvs-${index}" class="canvas-layer"></canvas>
        </div>
        
        <div class="control-zone">
          <div class="canvas-tools">
            <button type="button" class="btn-tool active" id="pen-btn-${index}" onclick="setToolMode(${index}, 'pen')">✏️ 記入</button>
            <button type="button" class="btn-tool" id="eraser-btn-${index}" onclick="setToolMode(${index}, 'eraser')">🧽 消しゴム</button>
            <button type="button" class="btn-tool" id="obj-eraser-btn-${index}" onclick="setToolMode(${index}, 'obj-eraser')">🧼 線消去</button>
            <button type="button" class="btn-tool" id="undo-btn-${index}" onclick="undoCanvas(${index})">↩️ 戻る</button>
            <button type="button" class="btn-tool" id="reset-btn-${index}" onclick="clearSpecificCanvas(${index})">🗑️ 全消去</button>
          </div>
          
          <div class="answer-area" id="ans-area-${index}">
            <div class="correct-ans">正解: ${displayAnswer}</div>
            <div class="ox-buttons">
              <button type="button" class="btn-o" id="btn-o-${index}" onclick="setScore(${index}, 1)">〇 正解</button>
              <button type="button" class="btn-x" id="btn-x-${index}" onclick="setScore(${index}, 0)">× まちがい</button>
            </div>
          </div>
        </div>
      `;
      container.appendChild(block);
      
      const cvs = document.getElementById(`cvs-${index}`);
      const ctx = cvs.getContext('2d');
      canvases.push(cvs); contexts.push(ctx); isDrawingArr.push(false); strokeHistories.push([]);
      
      setupCanvasEvents(cvs, ctx, index);
    });
    
    if (window.MathJax) await MathJax.typesetPromise();
  }

  function syncCanvasSizes() {
    activeQuestions.forEach((_, index) => {
      const zone = document.getElementById(`main-zone-${index}`);
      const cvs = document.getElementById(`cvs-${index}`);
      const rect = zone.getBoundingClientRect();
      
      cvs.width = rect.width;
      cvs.height = rect.height;
      
      redrawCanvas(index);
      setToolMode(index, toolModes[index]);
    });
  }

  function setToolMode(idx, mode) {
    toolModes[idx] = mode;
    
    document.getElementById(`pen-btn-${idx}`).classList.toggle('active', mode === 'pen');
    document.getElementById(`eraser-btn-${idx}`).classList.toggle('active', mode === 'eraser');
    document.getElementById(`obj-eraser-btn-${idx}`).classList.toggle('active', mode === 'obj-eraser');
  }

  // 内部履歴に基づいてキャンバス全体を再描画する関数
  function redrawCanvas(idx) {
    const cvs = canvases[idx];
    const ctx = contexts[idx];
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    
    if (!strokeHistories[idx]) return;
    
    strokeHistories[idx].forEach(stroke => {
      if (stroke.points.length === 0) return;
      ctx.beginPath();
      
      if (stroke.mode === 'pen') {
        ctx.globalCompositeOperation = 'source-over'; 
        ctx.lineWidth = stroke.width;
        ctx.strokeStyle = stroke.color;
      } else if (stroke.mode === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out'; 
        ctx.lineWidth = stroke.width;
      }
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      
      ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
      if (stroke.points.length === 1) {
        ctx.lineTo(stroke.points[0].x + 0.1, stroke.points[0].y);
      } else {
        for (let i = 1; i < stroke.points.length; i++) {
          ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
        }
      }
      ctx.stroke();
    });
  }

  // 1文字戻る (Undo) 処理
  function undoCanvas(idx) {
    if (strokeHistories[idx] && strokeHistories[idx].length > 0) {
      strokeHistories[idx].pop();
      redrawCanvas(idx);
    }
  }

  // 点Pと線分ABの最短距離を求めるヘルパー関数（オブジェクト消しゴム用）
  function getDistancePointToSegment(p, a, b) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    if (dx === 0 && dy === 0) {
      return Math.hypot(p.x - a.x, p.y - a.y);
    }
    let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / (dx * dx + dy * dy);
    t = Math.max(0, Math.min(1, t));
    const closestX = a.x + t * dx;
    const closestY = a.y + t * dy;
    return Math.hypot(p.x - closestX, p.y - closestY);
  }

  // オブジェクト消しゴムの衝突判定と線消去処理
  function checkCollision(pos, idx) {
    const history = strokeHistories[idx];
    if (!history) return false;
    let hitIndex = -1;
    
    // 上に描かれた線から順に判定するため逆順ループ
    for (let i = history.length - 1; i >= 0; i--) {
      const stroke = history[i];
      const pts = stroke.points;
      // 元の線の太さに応じて当たり判定の広さを調整
      const threshold = stroke.mode === 'eraser' ? stroke.width / 2 + 10 : 15;
      
      for (let j = 0; j < pts.length - 1; j++) {
        const dist = getDistancePointToSegment(pos, pts[j], pts[j+1]);
        if (dist < threshold) {
          hitIndex = i;
          break;
        }
      }
      if (hitIndex !== -1) break;
    }
    
    if (hitIndex !== -1) {
      history.splice(hitIndex, 1); // 該当する線を履歴から削除
      redrawCanvas(idx); // 再描画
      return true;
    }
    return false;
  }

  function setupCanvasEvents(cvs, ctx, idx) {
    const getPos = (e) => {
      const rect = cvs.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      const scaleX = cvs.width / rect.width;
      const scaleY = cvs.height / rect.height;
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    };
    
    let currentStroke = null;

    const start = (e) => {
      isDrawingArr[idx] = true;
      const p = getPos(e);
      const mode = toolModes[idx];
      
      if (mode === 'obj-eraser') {
        checkCollision(p, idx);
      } else {
        currentStroke = {
          mode: mode,
          points: [p],
          width: mode === 'pen' ? 3 : 24,
          color: '#1a237e'
        };
        
        ctx.beginPath();
        if (mode === 'pen') {
          ctx.globalCompositeOperation = 'source-over';
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#1a237e';
        } else {
          ctx.globalCompositeOperation = 'destination-out';
          ctx.lineWidth = 24;
        }
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.moveTo(p.x, p.y);
      }
    };
    
    const move = (e) => {
      if(!isDrawingArr[idx]) return;
      e.preventDefault();
      const p = getPos(e);
      const mode = toolModes[idx];
      
      if (mode === 'obj-eraser') {
        checkCollision(p, idx);
      } else if (currentStroke) {
        currentStroke.points.push(p);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      }
    };
    
    const stop = () => {
      if (!isDrawingArr[idx]) return;
      isDrawingArr[idx] = false;
      
      const mode = toolModes[idx];
      if (mode !== 'obj-eraser' && currentStroke && currentStroke.points.length > 0) {
        strokeHistories[idx].push(currentStroke);
      }
      currentStroke = null;
    };

    cvs.addEventListener('mousedown', start); cvs.addEventListener('mousemove', move); cvs.addEventListener('mouseup', stop);
    cvs.addEventListener('touchstart', start, {passive:false}); cvs.addEventListener('touchmove', move, {passive:false}); cvs.addEventListener('touchend', stop);
  }

  function clearSpecificCanvas(idx) {
    strokeHistories[idx] = [];
    redrawCanvas(idx);
  }

  function revealAllAnswers() {
    // 【追加】タイマーとタブ監視を終了させる
    isQuizActive = false;
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    document.removeEventListener('visibilitychange', handleTabLeave);

    // 【追加】もしタイマー表示が残っていれば「終了」にする
    if (isTimerEnabled) {
      document.getElementById('timer-count').innerText = "終了";
    }

    activeQuestions.forEach((_, i) => {
      document.getElementById(`ans-area-${i}`).style.display = 'block';
      
      const cvs = document.getElementById(`cvs-${i}`);
      cvs.style.pointerEvents = 'none';     
      cvs.style.backgroundColor = 'rgba(0, 0, 0, 0.02)'; 
      
      document.getElementById(`pen-btn-${i}`).disabled = true;
      document.getElementById(`eraser-btn-${i}`).disabled = true;
      document.getElementById(`obj-eraser-btn-${i}`).disabled = true;
      document.getElementById(`undo-btn-${i}`).disabled = true;
      document.getElementById(`reset-btn-${i}`).disabled = true;
    });
    document.getElementById('check-ans-btn').style.display = 'none';
    document.getElementById('submit-btn').style.display = 'block';
    if (window.MathJax) MathJax.typesetPromise();
  }

  function setScore(idx, val) {
    scores[idx] = val;
    document.getElementById(`btn-o-${idx}`).classList.toggle('selected', val === 1);
    document.getElementById(`btn-x-${idx}`).classList.toggle('selected', val === 0);
  }

  async function submitTest() {
    if (scores.includes(null)) {
      alert("すべての問題の「〇」か「×」を選択してください。");
      return;
    }
    
    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;
    submitBtn.innerText = "ページ全体の画像ファイルを生成中...";
    
    try {
      const quizScreen = document.getElementById('quiz-screen');
      
      // 💡 修正: html2canvasを動かす直前に、MathJaxが自動生成した非表示（ダブり原因）の隠し音声用テキストレイヤーを強制排除
      const ignoredElements = quizScreen.querySelectorAll('.mjx-chtml.MJXc-processing, mjx-assistive-mml');
      ignoredElements.forEach(el => {
        el.setAttribute('data-html2canvas-ignore', 'true');
      });
      
      const capturedCanvas = await html2canvas(quizScreen, {
        scale: 2, 
        useCORS: true,
        backgroundColor: '#f0f4f8',
        // 念のため、非表示要素をhtml2canvasに読み込ませないオプションも重ねて指定
        ignoreElements: (element) => {
          return element.tagName === 'MJX-ASSISTIVE-MML' || element.classList.contains('MJX_ASSISTIVE_MML');
        }
      });
      
      const wholePageImage = capturedCanvas.toDataURL('image/jpeg', 0.6);
      
      document.getElementById('quiz-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'block';
      
      const finalScore = scores.reduce((a,b)=>a+b,0);
      
      const payload = {
        name: document.getElementById('name').value,
        grade: document.getElementById('grade-select').value + "_" + activeTopics.join(','),
        number: document.getElementById('number').value, 
        score: finalScore,
        results: scores.join(','),
        images: [wholePageImage] 
      };

      await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
      document.getElementById('status-text').innerHTML = `送信完了！<br>スコア: ${activeQuestions.length}問中 ${finalScore}問正解`;
    } catch (e) {
      alert("エラーが発生しました。");
      submitBtn.disabled = false;
      submitBtn.innerText = "結果を送信する";
    }
  }
</script>
